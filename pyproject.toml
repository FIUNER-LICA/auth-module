[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-module"
version = "1.2.0"
description = "A modular authentication package with optional Flask frontend integration."
readme = "README.md"
authors = [
    { name = "Caupolicán Ré", email = "caupolican.re@uner.edu.ar" },
    { name = "Javier Diaz Zamboni", email = "javier.diaz@uner.edu.ar" },
    { name = "Jordán Insfrán", email = "jordan.insfran@uner.edu.ar" },
    { name = "Juan Rizzato", email = "juan.rizzato@uner.edu.ar" }
]
requires-python = ">=3.13"
dependencies = [
    # Core dependencies
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.2.2",
    "sender>=0.3.0",
    "werkzeug>=3.1.8",
]

[project.optional-dependencies]
flask = [
    "Flask>=3.1.3",
    "Flask-Mail>=0.10.0",
    "Flask-Session>=0.8.0",
    "Flask-WTF>=1.3.0",
    "email-validator>=2.3.0",
]
oauth = [
    "blinker>=1.9.0",
    "Flask-Dance>=7.1.0",
]

[dependency-groups]
test = [
    "auth-module[flask,oauth]", # Runtime deps come from the project's own extras (single source of truth).
    "cachelib>=0.17.0",
    "coverage>=7.15.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
dev = [
    {include-group = "test"},
    "build>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"auth_module.flask_ext" = [
    "templates/*.html",
    "static/css/*.css",
    "static/img/logo/*.png",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*proofs.py",
    "*/__init__.py"
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.coverage.xml]
output = "coverage-last.xml"

[tool.coverage.json]
output = "coverage-last.json"
