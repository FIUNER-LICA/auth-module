{% extends 'base.html' %}

{% block content %}
 
  <form method="post" action="{{ url_for('auth.login') }}">
    <div class="mb-3">
      <label for="email" class="form-label">Correo electrónico</label>
      <input type="email" class="form-control" id="email" name="email" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña</label>
      <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
  </form>
  <p class="mt-3 text-center">¿No tenés cuenta? <a href="{{ url_for('auth.register') }}">Registrate aquí</a></p>
  <p class="text-center"><a href="{{ url_for('auth.pw_recovery') }}">¿Olvidaste tu contraseña?</a></p>
  <div class="d-flex flex-column gap-2 mt-2">
    <a class="btn btn-outline-dark w-100" href="{{ url_for('auth.google_login') }}">Entrar con Google</a>
    <a class="btn btn-outline-dark w-100" href="{{ url_for('auth.github_login') }}">Entrar con GitHub</a>
  </div>
{% endblock %}
