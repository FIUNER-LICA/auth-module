{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
  <h2 class="text-center mb-4">{{ t('recovery_title') }}</h2>

  <form method="post" action="{{ url_for('auth.password_recovery') }}">
    {{ form.hidden_tag() }}
    <div class="mb-3">
      <label for="email" class="form-label">{{ t('email') }}</label>
      {{ form.email(class="form-control", id="email") }}
    </div>

    {{ form.submit(class="btn btn-primary w-100", value=t('recovery_button')) }}
  </form>

  <div class="mb-1"></div>

  <div class="d-grid gap-2">
    <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">{{ t('back_button') }}</a>
  </div>

</div>
{% endblock %}
