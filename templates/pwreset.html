{% extends 'base.html' %}

{% block content %}
<div class="inicio-container">
  <h2 class="text-center mb-4">Restablecer contraseña</h2>
  <form method="post" action="{{ url_for('auth.pw_reset') }}">
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña</label>
      <input type="password" autocomplete="new-password" class="form-control" id="password" name="password" required>
      <label for="password" class="form-label">Reingresa la contraseña</label>
      <input type="password" class="form-control" id="repassword" name="repassword" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Registrarse</button>
  </form>
  <p class="mt-3 text-center">¿Ya tenés cuenta? <a href="{{ url_for('auth.login') }}">Iniciar sesión</a></p>
</div>
{% endblock %}
