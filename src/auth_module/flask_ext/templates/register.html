{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
  <h2 class="text-center mb-4">{{ t('register_title') }}</h2>

  <form method="post" action="{{ url_for('auth.register') }}">
    <div class="mb-3">
      <label for="email" class="form-label">{{ t('email') }}</label>
      <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">{{ t('password') }}</label>
      <input type="password" autocomplete="new-password" class="form-control" id="password" name="password" required>

      <label for="repassword" class="form-label">{{ t('reenter_password') }}</label>
      <input type="password" class="form-control" id="repassword" name="repassword" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">{{ t('register_button') }}</button>
  </form>

  <p class="mt-3 text-center">{{ t('already_have_account') }} <a href="{{ url_for('auth.login') }}">{{ t('login_here') }}</a></p>
</div>
{% endblock %}
