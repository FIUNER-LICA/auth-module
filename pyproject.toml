[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-module"
version = "0.1.0"
description = "A modular authentication package with optional Flask frontend integration."
readme = "README.md"
authors = [
    { name = "Lautaro Caupolicán Ré", email = "caupolican.re@uner.edu.ar" },
    { name = "Javier Diaz Zamboni", email = "javier.diaz@uner.edu.ar" },
    { name = "Jordán Insfrán", email = "jordan.insfran@uner.edu.ar" },
    { name = "Juan Rizzato", email = "juan.rizzato@uner.edu.ar" }
]
requires-python = ">=3.13"
dependencies = [
    # Core dependencies
    "python-dotenv==1.2.2",
    "werkzeug==3.1.8",
    "itsdangerous==2.2.0",
    "sender==0.3.0"
]

[project.optional-dependencies]
flask = [
    "Flask==3.1.3",
    "Flask-Session==0.8.0",
    "Flask-Mail==0.10.0"
]
oauth = [
    "Flask-Dance==7.1.0",
    "blinker==1.9.0"
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "build==1.5.0"
]

[tool.setuptools.packages.find]
where = ["src"]
