{% extends 'base.html' %}

{% block content %}
<form method="post" action="{{ url_for('auth.login') }}">
  <div class="mb-3">
    <label for="email" class="form-label">{{ t('email') }}</label>
    <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">{{ t('password') }}</label>
    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
  </div>

  <button type="submit" class="btn btn-primary w-100">{{ t('login_button') }}</button>
</form>

<p class="mt-3 text-center">{{ t('no_account_question') }} <a href="{{ url_for('auth.register') }}">{{ t('register_here') }}</a></p>
<p class="text-center"><a href="{{ url_for('auth.password_recovery') }}">{{ t('forgot_password_question') }}</a></p>

<div class="d-flex flex-column gap-2 mt-2">
  <a class="btn btn-outline-dark w-100" href="#">{{ t('login_google') }}</a>
  <a class="btn btn-outline-dark w-100" href="#">{{ t('login_github') }}</a>
</div>
{% endblock %}
