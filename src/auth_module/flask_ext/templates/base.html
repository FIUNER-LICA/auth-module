<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de registro de usuarios e inicio de sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .auth-container {
          max-width: 420px;
          margin: 40px auto;
          background: #fff;
          border-radius: 10px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.04);
          padding: 2rem 1.5rem;
      }
      @media (max-width: 500px) {
          .auth-container {
              padding: 1rem 0.5rem;
              max-width: 98vw;
          }
      }
    </style>
  </head>

  <body class="bg-light">
    <div class="auth-container">

      <div class="text-center mb-3">
        <img src="{{ url_for('auth.static', filename='logo-LICA-512.png') }}" alt="Logo" width="350"  class=" mb-3" style="border-radius:10px;">
        <h2 class="mb-1">Módulo de registro de usuarios e inicio de sesión</h2>
      </div>

      <div class="container mt-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block content %}
      {% endblock %}
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>

</html>
